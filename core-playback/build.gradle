plugins {
    id 'com.android.library'
}

android {
    namespace 'com.brouken.player.core.playback'
    compileSdk 35
    ndkVersion '21.4.7075529'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        disable 'MissingTranslation'
        disable 'UnsafeOptInUsageError'
    }
}

dependencies {
    def media3_version = '1.8.0'

    api "androidx.media3:media3-session:$media3_version"
    api "androidx.media3:media3-datasource:$media3_version"
    api "androidx.media3:media3-decoder:$media3_version"
    api "androidx.media3:media3-common:$media3_version"
    api "androidx.media3:media3-container:$media3_version"
    api "androidx.annotation:annotation:1.9.1"

    // The app does NOT use the stock Maven androidx.media3:media3-exoplayer /
    // media3-extractor artifacts — app/libs contains custom-built replacements
    // (see app/libs/README.md), and app/build.gradle deliberately excludes the
    // Maven media3-exoplayer module everywhere to avoid it conflicting with those.
    // This module needs the same ExoPlayer/DefaultTrackSelector/DefaultExtractorsFactory
    // symbols at compile time, so it compiles against those same local AARs rather than
    // adding a second, conflicting copy from Maven. `compileOnly` (not `implementation`)
    // so core-playback's own output doesn't re-package these classes — `app` already
    // provides them at runtime via its own `implementation fileTree(dir: "libs", ...)`.
    compileOnly fileTree(dir: "$rootDir/app/libs", include: ["lib-exoplayer-release.aar", "lib-extractor-release.aar"])
    testImplementation fileTree(dir: "$rootDir/app/libs", include: ["lib-exoplayer-release.aar", "lib-extractor-release.aar"])

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}
