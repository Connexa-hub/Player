name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Unit tests (core-gestures — pure JVM, no Android)
        run: ./gradlew :core-gestures:test --stacktrace

      - name: Unit tests (feature-library-ui)
        run: ./gradlew :feature-library-ui:testDebugUnitTest --stacktrace

      - name: Unit tests (core-library)
        run: ./gradlew :core-library:testDebugUnitTest --stacktrace

      - name: Unit tests (feature-player-ui)
        run: ./gradlew :feature-player-ui:testDebugUnitTest --stacktrace

      - name: Unit tests (core-design-system)
        run: ./gradlew :core-design-system:testDebugUnitTest --stacktrace

      - name: Unit tests (core-playback)
        run: ./gradlew :core-playback:testDebugUnitTest --stacktrace

      - name: Unit tests (app)
        run: ./gradlew :app:testLatestUniversalDebugUnitTest --stacktrace

      - name: Lint (app)
        run: ./gradlew :app:lintLatestUniversalDebug --stacktrace

      - name: Assemble debug (app)
        run: ./gradlew :app:assembleLatestUniversalDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*.html
